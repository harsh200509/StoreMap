version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: storemap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: storemap
      POSTGRES_PASSWORD: storemap_secret
      POSTGRES_DB: storemap
    ports:
      - '5440:5432'
    volumes:
      - storemap_pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: storemap_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@storemap.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  storemap_pgdata:
